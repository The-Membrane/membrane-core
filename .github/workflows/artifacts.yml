name: Artifacts

on:
  push:
    branches:
      - master
      - main
      - oracle_pricing
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-opt (binaryen)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Create temporary workspace
        run: |
          cp Cargo.toml Cargo.toml.backup
          cat > Cargo.toml << 'EOF'
          [workspace]
          resolver = "2"
          members = [
              "packages/membrane",
              "contracts/auction",
              "contracts/cdp",
              "contracts/liq-queue",
              "contracts/mars-vault-token",
              "contracts/oracle",
              "contracts/points-system",
              "contracts/staking",
              "contracts/system_discounts",
              "contracts/tokenfactory",
              "contracts/vesting",
          ]

          exclude = [
              "my_scripts", 
              "artifacts", 
              "contracts/cdp/src/testing/*", 
              "contracts/target/*"
          ]

          [workspace.dependencies]
          base64ct = "=1.7.3"
          neutron-sdk = "0.11.1"

          [profile.release]
          codegen-units = 1
          debug = false
          debug-assertions = false
          incremental = false
          lto = true
          opt-level = 'z'
          overflow-checks = true
          panic = 'abort'
          rpath = false
          EOF

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Build WASM contracts
        run: |
          RUSTFLAGS='-C link-arg=-s' cargo build --release --target wasm32-unknown-unknown \
            -p auction \
            -p cdp \
            -p liq-queue \
            -p mars_vault_token \
            -p oracle \
            -p points_system \
            -p staking \
            -p system_discounts \
            -p tokenfactory \
            -p vesting

      - name: Optimize WASM files
        run: |
          mkdir -p artifacts
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            filename=$(basename "$wasm")
            echo "Optimizing $filename..."
            wasm-opt -Os --signext-lowering "$wasm" -o "artifacts/$filename"
          done

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.wasm > checksums.txt
          cat checksums.txt

      - name: Restore original Cargo.toml
        if: always()
        run: |
          if [ -f Cargo.toml.backup ]; then
            mv Cargo.toml.backup Cargo.toml
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/
