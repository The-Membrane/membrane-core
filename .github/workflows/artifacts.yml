name: Artifacts

on:
  push:
    branches:
      - master
      - main
      - oracle_pricing
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.89.0
          target: wasm32-unknown-unknown
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-opt (binaryen)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Install cw-optimizoor
        run: cargo install cw-optimizoor

      - name: Create temporary workspace for selected contracts
        run: |
          # Backup original Cargo.toml
          cp Cargo.toml Cargo.toml.backup
          
          # Create modified Cargo.toml with only the contracts we want to build
          cat > Cargo.toml << 'EOF'
          [workspace]
          resolver = "2"
          members = [
              "packages/membrane",
              "contracts/auction",
              "contracts/cdp",
              "contracts/liq-queue",
              "contracts/mars-vault-token",
              "contracts/oracle",
              "contracts/points-system",
              "contracts/staking",
              "contracts/system_discounts",
              "contracts/tokenfactory",
              "contracts/vesting",
          ]

          exclude = [
              "my_scripts", 
              "artifacts", 
              "contracts/cdp/src/testing/*", 
              "contracts/target/*"
          ]

          [workspace.dependencies]
          base64ct = "=1.7.3"
          neutron-sdk = "0.11.1"

          [profile.release]
          codegen-units = 1
          debug = false
          debug-assertions = false
          incremental = false
          lto = true
          opt-level = 'z'
          overflow-checks = true
          panic = 'abort'
          rpath = false
          EOF

      - name: Update Cargo.lock for modified workspace
        run: cargo generate-lockfile

      - name: Build optimized WASM contracts
        run: cargo cw-optimizoor

      - name: Restore original Cargo.toml
        run: mv Cargo.toml.backup Cargo.toml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/
