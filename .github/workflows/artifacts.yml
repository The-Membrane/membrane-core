name: Artifacts

on:
  push:
    branches:
      - master
      - main
      - oracle_pricing
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.89.0  # Use the version we know works locally
          override: true

      - name: Install cargo make
        uses: davidB/rust-cargo-make@v1

      - name: Clear Cargo registry cache and update
        run: |
          # Clear corrupted registry cache
          rm -rf ~/.cargo/registry/src/index.crates.io-*
          rm -rf ~/.cargo/registry/index/*
          # Force update registry
          cargo update --verbose
          # Verify registry is working
          cargo search base64ct --limit 1

      - name: Alternative registry approach (if main fails)
        if: failure()
        run: |
          # Try using a different registry source
          echo "Main registry failed, trying alternative approach..."
          # Clear everything again
          rm -rf ~/.cargo/registry/*
          # Force fresh download
          cargo update --verbose

      - name: Compile contracts to wasm
        run: cargo make rust-optimizer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/
