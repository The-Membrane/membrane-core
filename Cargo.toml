[workspace]
members = [
    "packages/membrane",
    "contracts/cdp",
    "contracts/liq-queue",
    "contracts/ltv_disco",
    "contracts/mars-mirror",
    "contracts/mars-vault-token",
    "contracts/oracle",
    "contracts/points-system",
    "contracts/staking",
    "contracts/system_discounts",
    "contracts/tokenfactory",
    "contracts/revenue-distributor",
    "contracts/neutron-proxy",
    "contracts/transmuter",
    "contracts/transmuter-lockdrop",
    "contracts/yield-arb",
    "contracts/neutron_launch",
    "contracts/emissions-voting"
]

exclude = [
    "my_scripts", 
    "artifacts", 
    "contracts/cdp/src/testing/*", 
    "contracts/target/*",
    "contracts/managed-market",
    "contracts/market-manager", 
    "contracts/mm-swap",
    "contracts/mm_osmosis_oracle"
]

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 'z'
overflow-checks = true
panic = 'abort'
rpath = false

[workspace.dependencies]
base64ct = "=1.7.3"
osmo-bindings = { git = "https://github.com/osmosis-labs/bindings.git", rev = "531cf7bd58d90ce4681de84556cc9bda428aec68" }

