[config]
default_to_workspace = false
skip_core_tasks = true

[env]
# Updated to new unified cosmwasm/optimizer (replaces deprecated workspace-optimizer)
RUST_OPTIMIZER_VERSION = "0.17.0"
# Use rust version from rust-optimizer Dockerfile (see https://github.com/CosmWasm/rust-optimizer/blob/main/Dockerfile#L1)
# to be sure that we compile / test against the same version
RUST_VERSION = "1.85.0"
NIGHTLY_VERSION = "nightly-2023-08-29"


[tasks.rust-optimizer]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"
script = """
# New unified optimizer handles architecture automatically
docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  cosmwasm/optimizer:${RUST_OPTIMIZER_VERSION}
"""

[tasks.rust-optimizer-exclude]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"
script = """
# Create backups of workspace files
cp Cargo.toml Cargo.toml.backup
cp Cargo.lock Cargo.lock.backup 2>/dev/null || true

# Remove Cargo.lock so the optimizer can generate a fresh one inside the container
rm -f Cargo.lock

# Create the modified Cargo.toml with only contracts that don't have problematic dependencies
cat > Cargo.toml << 'EOF'
[workspace]
resolver = "2"
members = [
    "packages/membrane",
    "contracts/auction",
    "contracts/cdp",
    "contracts/liq-queue",
    "contracts/mars-vault-token",
    "contracts/oracle",
    "contracts/points-system",
    "contracts/staking",
    "contracts/system_discounts",
    "contracts/tokenfactory",
    "contracts/vesting",
]

exclude = [
    "my_scripts", 
    "artifacts", 
    "contracts/cdp/src/testing/*", 
    "contracts/target/*"
]

[workspace.dependencies]
base64ct = "=1.7.3"
osmo-bindings = { git = "https://github.com/osmosis-labs/bindings.git", rev = "531cf7bd58d90ce4681de84556cc9bda428aec68" }
neutron-sdk = { git = "https://github.com/neutron-org/neutron-sdk", rev = "98d81ea" }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 'z'
overflow-checks = true
panic = 'abort'
rpath = false
EOF

# Verify the exclusions are in place
echo "Modified Cargo.toml contents:"
cat Cargo.toml

# Run the new unified optimizer
docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  cosmwasm/optimizer:${RUST_OPTIMIZER_VERSION}

# Restore original workspace files
mv Cargo.toml.backup Cargo.toml
mv Cargo.lock.backup Cargo.lock 2>/dev/null || true
echo "Restored original Cargo.toml and Cargo.lock"
"""
