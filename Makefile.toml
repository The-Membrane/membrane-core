[config]
default_to_workspace = false
skip_core_tasks = true

[env]
# If you bump this version, verify RUST_VERSION correctness
RUST_OPTIMIZER_VERSION = "0.13.0"
# Use rust version from rust-optimizer Dockerfile (see https://github.com/CosmWasm/rust-optimizer/blob/main/Dockerfile#L1)
# to be sure that we compile / test against the same version
RUST_VERSION = "1.85.0"
NIGHTLY_VERSION = "nightly-2023-08-29"


[tasks.rust-optimizer]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"
script = """
if [[ $(arch) == "arm64" ]]; then
  image="cosmwasm/workspace-optimizer-arm64:${RUST_OPTIMIZER_VERSION}"
else
  image="cosmwasm/workspace-optimizer:${RUST_OPTIMIZER_VERSION}"
fi
docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/code/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  ${image}
"""

[tasks.rust-optimizer-exclude]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"
script = """
if [[ $(arch) == "arm64" ]]; then
  image="cosmwasm/workspace-optimizer-arm64:${RUST_OPTIMIZER_VERSION}"
else
  image="cosmwasm/workspace-optimizer:${RUST_OPTIMIZER_VERSION}"
fi

# Create a temporary Cargo.toml that only includes safe contracts
cp Cargo.toml Cargo.toml.backup

# Create the modified Cargo.toml with only contracts that don't have problematic dependencies
cat > Cargo.toml << 'EOF'
[workspace]
members = [
    "packages/membrane",
    "contracts/auction",
    "contracts/cdp",
    "contracts/discount_vault",
    "contracts/liq-queue",
    "contracts/mars-vault-token",
    "contracts/oracle",
    "contracts/osmosis-proxy",
    "contracts/points-system",
    "contracts/staking",
    "contracts/system_discounts",
    "contracts/tokenfactory",
    "contracts/vesting",
]

exclude = [
    "my_scripts", 
    "artifacts", 
    "contracts/cdp/src/testing/*", 
    "contracts/target/*"
]

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 'z'
overflow-checks = true
panic = 'abort'
rpath = false
EOF

# Verify the exclusions are in place
echo "Modified Cargo.toml contents:"
cat Cargo.toml

# Clear any existing registry cache to force fresh downloads
rm -rf ~/.cargo/registry/src/index.crates.io-* ~/.cargo/registry/index/* 2>/dev/null || true

# Run the optimizer with the modified workspace
docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/code/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  ${image}

# Restore original Cargo.toml
mv Cargo.toml.backup Cargo.toml
echo "Restored original Cargo.toml"
"""
