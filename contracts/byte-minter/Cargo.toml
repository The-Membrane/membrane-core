[package]
name = "byte-minter"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { version = "2.3.0", default-features = false, features = ["cosmwasm_1_1"] }
cosmwasm-schema = "1.4.0"
cw-storage-plus = "1.0.3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
membrane = { path = "../../packages/membrane" }
osmosis-std = { version = "0.16.2" }
cw721-base = { version = "0.16.0", default-features = false, features = ["library"] }

[dev-dependencies]
cw-multi-test = "1.0.3"
track_manager = { path = "../track-manager" }
race-engine = { path = "../race-engine" } 
tokenfactory = { path = "../tokenfactory" }