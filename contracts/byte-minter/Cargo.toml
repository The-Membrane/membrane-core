[package]
name = "byte-minter"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { version = "2.0.4", default-features = false, features = ["cosmwasm_2_0", "stargate"] }
cosmwasm-schema = "2.0.4"
cw-storage-plus = "2.0.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
membrane = { path = "../../packages/membrane" }
osmosis-std = { version = "0.27.0" }
cw721-base = { version = "0.20.0", default-features = false, features = ["library"] }

[dev-dependencies]
cw-multi-test = "2.0.0"
track_manager = { path = "../track-manager" }
race-engine = { path = "../race-engine" } 
tokenfactory = { path = "../tokenfactory" }