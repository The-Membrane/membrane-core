[package]
name = "race-engine"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-schema = "2.0.4"
cosmwasm-std = { version = "2.0.4", default-features = false, features = ["cosmwasm_2_0", "stargate"] }
cw-storage-plus = "2.0.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
membrane = { path = "../../packages/membrane" }
blake2 = "0.10.6"

[dev-dependencies]
cw-multi-test = "2.0.0" 
