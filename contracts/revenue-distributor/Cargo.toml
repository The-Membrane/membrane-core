[package]
name = "revenue-distributor"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { version = "2.0.4", default-features = false, features = ["cosmwasm_2_0", "stargate"] }
cosmwasm-schema = "2.0.4"
serde = { version = "1.0", default-features = false, features = ["derive"] }
schemars = "0.8"
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
thiserror = { version = "1.0.31" }
cw-utils = "2.0.0"
membrane = { path = "../../packages/membrane" }

[dev-dependencies]
cw-multi-test = "2.0.0"
