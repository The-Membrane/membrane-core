[package]
name = "tournament"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
membrane = { path = "../../packages/membrane" }
race-engine = { path = "../race-engine" }
cosmwasm-schema = "1.0.0"
cosmwasm-std = { version = "2.3.0", default-features = false, features = ["cosmwasm_1_1"] }
cosmwasm-storage = "1.0.0"
cw-storage-plus = "1.0.3"
cw2 = "0.13.2"
schemars = "0.8.8"
serde = { version = "1.0.137", default-features = false, features = ["derive"] }
thiserror = "1.0.31"
serde_json = "1.0.137"

[dev-dependencies]
cw-multi-test = "1.0.3" 