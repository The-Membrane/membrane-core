[package]
name = "tournament"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
membrane = { path = "../../packages/membrane" }
race-engine = { path = "../race-engine" }
cosmwasm-schema = "2.0.4"
cosmwasm-std = { version = "2.0.4", default-features = false, features = ["cosmwasm_2_0", "stargate"] }
cosmwasm-storage = "1.0.0"
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
schemars = "0.8.8"
serde = { version = "1.0.137", default-features = false, features = ["derive"] }
thiserror = "1.0.31"
serde_json = "1.0.137"

[dev-dependencies]
cw-multi-test = "2.0.0" 